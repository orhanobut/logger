buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    // Upgrade the compiler used by AGP's built-in Kotlin support.
    classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.20'
  }
}

plugins {
  id 'com.android.library' version '9.4.1' apply false
  id 'com.android.application' version '9.4.1' apply false
  id 'com.vanniktech.maven.publish' version '0.37.0' apply false
}

subprojects {
  group = GROUP
  version = VERSION_NAME

  apply plugin: 'checkstyle'
  checkstyle {
    toolVersion = '14.3.0'
  }

  def styleCheck = tasks.register('checkstyle', Checkstyle) {
    configFile = rootProject.file('checkstyle.xml')
    source 'src/main/java'
    ignoreFailures = false
    showViolations = true
    include '**/*.java'
    classpath = files()
  }

  tasks.matching { it.name == 'check' }.configureEach {
    dependsOn styleCheck
  }
}

tasks.register('clean', Delete) {
  delete layout.buildDirectory
}

ext {
  minSdkVersion = 8
  targetSdkVersion = 37
  compileSdkVersion = 37
  buildToolsVersion = '37.0.0'
}

ext.deps = [
    junit      : 'junit:junit:4.13.2',
    truth      : 'com.google.truth:truth:1.4.5',
    robolectric: 'org.robolectric:robolectric:4.17',
    mockito    : 'org.mockito:mockito-core:5.24.0',
    json       : 'org.json:json:20260814',
    annotations: 'androidx.annotation:annotation:1.11.0',
    kotlin     : 'org.jetbrains.kotlin:kotlin-stdlib:2.4.20'
]
