import com.vanniktech.maven.publish.AndroidSingleVariantLibrary
import com.vanniktech.maven.publish.JavadocJar
import com.vanniktech.maven.publish.SourcesJar
import org.gradle.process.CommandLineArgumentProvider

abstract class MockitoAgentArgumentProvider implements CommandLineArgumentProvider {
  @Classpath
  abstract ConfigurableFileCollection getAgentClasspath()

  @Override
  Iterable<String> asArguments() {
    ["-javaagent:${agentClasspath.singleFile}"]
  }
}

plugins {
  id 'com.android.library'
  id 'com.vanniktech.maven.publish'
}

android {
  namespace = 'com.orhanobut.logger'
  compileSdk = rootProject.ext.compileSdkVersion
  buildToolsVersion = rootProject.ext.buildToolsVersion

  defaultConfig {
    minSdk = rootProject.ext.minSdkVersion
  }

  compileOptions {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
  }

  // Tests are written in Kotlin; the published library remains Java.
  sourceSets {
    test.kotlin.srcDirs = ['src/test/java']
  }

  lint {
    textReport = true
  }

  testOptions {
    unitTests.returnDefaultValues = true
    unitTests.includeAndroidResources = true
  }
}

def mockitoAgentDependencies = configurations.dependencyScope('mockitoAgentDependencies')
def mockitoAgent = configurations.resolvable('mockitoAgent') {
  extendsFrom mockitoAgentDependencies.get()
}
def deps = rootProject.ext.deps

dependencies {
  api deps.annotations

  testImplementation deps.junit
  testImplementation deps.truth
  testImplementation deps.robolectric
  testImplementation deps.mockito
  testImplementation deps.json
  testImplementation deps.kotlin
  // Mockito's inline mock maker needs an agent on modern JVMs.
  add('mockitoAgentDependencies', deps.mockito) { transitive = false }
}

tasks.withType(Test).configureEach {
  def agent = objects.newInstance(MockitoAgentArgumentProvider)
  agent.agentClasspath.from(mockitoAgent)
  jvmArgumentProviders.add(agent)
  // Android 16's shared-memory emulation uses JDK file descriptor access.
  jvmArgs '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED'
}

mavenPublishing {
  configure(new AndroidSingleVariantLibrary(
      new JavadocJar.Javadoc(), new SourcesJar.Sources(), 'release'))
  publishToMavenCentral()
}
